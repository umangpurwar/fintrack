{% extends 'base.html' %}

{% block title %}Signed Out{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4 col-lg-3 text-center">
    <div class="card">
      <div class="card-body p-4">
        <i class="bi bi-box-arrow-right display-4 text-muted mb-3"></i>
        <h5 class="card-title">You have been signed out</h5>
        <p class="text-muted small">Your session has been ended securely.</p>
        <a href="{% url 'login' %}" class="btn btn-dark mt-2">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In Again
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
